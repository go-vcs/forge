name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go test -race -count=1 ./...

  # Coverage is reported per package; the committed fuzz corpora run as part of
  # every plain `go test`, and each fuzz target also runs for a short time here.
  coverage-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go test -count=1 -cover ./...
      - run: go test -run '^$' -fuzz '^FuzzVerify$' -fuzztime 20s ./internal/adminauth
      - run: go test -run '^$' -fuzz '^FuzzEnvelope$' -fuzztime 20s ./internal/adminauth
      - run: go test -run '^$' -fuzz '^FuzzParseStatement$' -fuzztime 20s ./internal/attest
      - run: go test -run '^$' -fuzz '^FuzzAttestationVerify$' -fuzztime 20s ./internal/attest
      - run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s ./internal/sshkeys
      - run: go test -run '^$' -fuzz '^FuzzParseExec$' -fuzztime 20s ./internal/gitssh
      - run: go test -run '^$' -fuzz '^FuzzParsePath$' -fuzztime 20s ./internal/githttp
      - run: go test -run '^$' -fuzz '^FuzzRequest$' -fuzztime 20s ./internal/githttp

  # The toolchain is the one go.mod names, so a floor too low to carry the
  # standard library's fixes is a finding here: govulncheck exits 3 on any.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod, check-latest: true, cache: true }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
